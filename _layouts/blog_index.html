---
layout: default
---
<div class="blog-index">
  <h1>{{ page.title }}</h1>
  <ul>
    {% for post in site.posts %}
      {% if post.categories contains 'blog' %}
        <li>
          <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
          <p>{{ post.excerpt }}</p>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
</div>
